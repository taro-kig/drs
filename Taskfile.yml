# Task runner (https://taskfile.dev). `task` shows the list.
# Install: macOS / Linux → `aqua i -l` (pinned in aqua.yaml)   Windows → `winget install Task.Task`
version: "3"

vars:
  # DCTL は Resolve の LUT フォルダに置く。混ざらないようにサブフォルダ（drs）にまとめる
  LUT_ROOT:
    sh: |
      case "{{OS}}" in
        windows) echo "C:/ProgramData/Blackmagic Design/DaVinci Resolve/Support/LUT" ;;
        darwin)  echo "/Library/Application Support/Blackmagic Design/DaVinci Resolve/LUT" ;;
        *)       echo "/opt/resolve/LUT" ;;
      esac
  DCTL_DIR: "{{.LUT_ROOT}}/drs"
  # OFX プラグインの置き場所（管理者権限が要る）
  OFX_DIR:
    sh: |
      case "{{OS}}" in
        windows) echo "C:/Program Files/Common Files/OFX/Plugins" ;;
        darwin)  echo "/Library/OFX/Plugins" ;;
        *)       echo "/usr/OFX/Plugins" ;;
      esac
  # Windows は MSBuild のパス長制限（260文字）に当たりやすいので、短い %LOCALAPPDATA% の下でビルドする
  OFX_BUILD: '{{if eq OS "windows"}}{{.LOCALAPPDATA | replace "\\" "/"}}/drs/build/ofx{{else}}build/ofx{{end}}'
  # winget で入れた CMake は PATH に載っていないことがあるので、Windows はフルパスで呼ぶ
  CMAKE: '{{if eq OS "windows"}}"C:/Program Files/CMake/bin/cmake.exe"{{else}}cmake{{end}}'
  CTEST: '{{if eq OS "windows"}}"C:/Program Files/CMake/bin/ctest.exe"{{else}}ctest{{end}}'

tasks:
  default:
    desc: このリスト
    silent: true
    cmds:
      - task --list

  lint:
    desc: DCTL が ASCII だけか確認（スライダーのラベルの絵文字だけは OK。コメントやコードに日本語などがあると AMD の OpenCL で Resolve が落ちる）
    silent: true
    cmds:
      - cmd: >-
          powershell -NoProfile -Command '
          $bad = $false;
          foreach ($f in Get-ChildItem dctl/*.dctl, dctl/legacy/*.dctl) {
            $n = 0;
            foreach ($line in [IO.File]::ReadAllLines($f.FullName, [Text.Encoding]::UTF8)) {
              $n++;
              $chk = $line -replace "^(\s*DEFINE_UI_PARAMS\([^,]*,)[^,]*,", "`$1,";
              if ($chk -match "[^\x00-\x7F]") { "$($f.Name):$n non-ASCII outside a slider label: $line"; $bad = $true }
            }
          };
          if ($bad) { exit 1 } else { "lint ok" }'
        platforms: [windows]
      - cmd: >-
          sh -c 'bad=0;
          for f in dctl/*.dctl dctl/legacy/*.dctl; do
            out=$(LC_ALL=C sed -E "s/^([[:space:]]*DEFINE_UI_PARAMS\([^,]*,)[^,]*,/\1,/" "$f" | LC_ALL=C grep -n "$(printf "[\200-\377]")");
            if [ -n "$out" ]; then echo "$out" | sed "s|^|$f:|"; bad=1; fi;
          done;
          if [ $bad = 1 ]; then echo "non-ASCII outside a slider label"; exit 1; else echo "lint ok"; fi'
        platforms: [darwin, linux]

  install:
    desc: dctl/ を Resolve の LUT/drs に入れる（入れ直し。消したファイルは向こうからも消える）
    silent: true
    deps: [lint]
    cmds:
      - cmd: >-
          powershell -NoProfile -Command '
          $d = "{{.DCTL_DIR}}";
          if (Test-Path $d) { Remove-Item -Recurse -Force $d };
          New-Item -ItemType Directory -Force $d | Out-Null;
          Copy-Item dctl/*.dctl $d;
          Get-ChildItem $d | ForEach-Object { "installed: $($_.FullName)" };
          "Resolve: 再起動するか、Project Settings > Color Management > Update Lists"'
        platforms: [windows]
      - cmd: |
          sh -c '
          d="{{.DCTL_DIR}}"
          rm -rf "$d" && mkdir -p "$d" && cp dctl/*.dctl "$d"/ || { echo "書けない場合は sudo task install"; exit 1; }
          for f in "$d"/*; do echo "installed: $f"; done
          echo "Resolve: 再起動するか、Project Settings > Color Management > Update Lists"'
        platforms: [darwin, linux]

  install:legacy:
    desc: install に加えて dctl/legacy/ の古い DCTL も入れる（古いプロジェクトを開くとき用。次の install で消える）
    silent: true
    deps: [install]
    cmds:
      - cmd: >-
          powershell -NoProfile -Command '
          $d = "{{.DCTL_DIR}}";
          Copy-Item dctl/legacy/*.dctl $d;
          Get-ChildItem dctl/legacy/*.dctl | ForEach-Object { "installed (legacy): $d/$($_.Name)" }'
        platforms: [windows]
      - cmd: |
          sh -c '
          d="{{.DCTL_DIR}}"
          cp dctl/legacy/*.dctl "$d"/ || exit 1
          for f in dctl/legacy/*.dctl; do echo "installed (legacy): $d/$(basename "$f")"; done'
        platforms: [darwin, linux]

  uninstall:
    desc: LUT/drs ごと消す
    silent: true
    cmds:
      - cmd: >-
          powershell -NoProfile -Command '$d = "{{.DCTL_DIR}}"; if (Test-Path $d) { Remove-Item -Recurse -Force $d; "removed: $d" } else { "not installed" }'
        platforms: [windows]
      - cmd: >-
          sh -c 'd="{{.DCTL_DIR}}"; if [ -d "$d" ]; then rm -rf "$d" && echo "removed: $d"; else echo "not installed"; fi'
        platforms: [darwin, linux]

  status:
    desc: 入っているものと、リポジトリとの差分
    silent: true
    cmds:
      - cmd: >-
          powershell -NoProfile -Command '
          $d = "{{.DCTL_DIR}}";
          if (-not (Test-Path $d)) { "not installed ($d)"; exit 0 };
          "installed in $d";
          $names = @(Get-ChildItem dctl/*.dctl | ForEach-Object Name) + @(Get-ChildItem $d | ForEach-Object Name) | Sort-Object -Unique;
          foreach ($n in $names) {
            $a = Join-Path dctl $n; $b = Join-Path $d $n;
            if (-not (Test-Path $b)) { "  [not installed] $n" }
            elseif (-not (Test-Path $a)) { if (Test-Path (Join-Path dctl/legacy $n)) { "  [legacy]        $n" } else { "  [extra]         $n" } }
            elseif ((Get-FileHash $a).Hash -ne (Get-FileHash $b).Hash) { "  [outdated]      $n" }
            else { "  [ok]            $n" }
          }'
        platforms: [windows]
      - cmd: |
          sh -c '
          d="{{.DCTL_DIR}}"
          [ -d "$d" ] || { echo "not installed ($d)"; exit 0; }
          echo "installed in $d"
          for n in $( (cd dctl && ls *.dctl; ls "$d") | sort -u ); do
            if [ ! -e "$d/$n" ]; then echo "  [not installed] $n"
            elif [ ! -e "dctl/$n" ] && [ -e "dctl/legacy/$n" ]; then echo "  [legacy]        $n"
            elif [ ! -e "dctl/$n" ]; then echo "  [extra]         $n"
            elif ! cmp -s "dctl/$n" "$d/$n"; then echo "  [outdated]      $n"
            else echo "  [ok]            $n"; fi
          done'
        platforms: [darwin, linux]

  ofx:build:
    desc: OFX プラグインをビルドしてテストする（要 CMake と C++ コンパイラ。Windows は VS 2022 Build Tools）
    sources:
      - ofx/**/*
    generates:
      - "{{.OFX_BUILD}}/bundles/**/*"
    cmds:
      - cmd: '{{.CMAKE}} -S ofx -B {{.OFX_BUILD}} -G "Visual Studio 17 2022" -A x64'
        platforms: [windows]
      - cmd: '{{.CMAKE}} -S ofx -B {{.OFX_BUILD}} -DCMAKE_BUILD_TYPE=Release'
        platforms: [darwin, linux]
      - '{{.CMAKE}} --build {{.OFX_BUILD}} --config Release --parallel'
      - '{{.CTEST}} --test-dir {{.OFX_BUILD}} -C Release --output-on-failure'

  ofx:install:
    desc: OFX プラグインをビルドして Resolve の OFX フォルダに入れる（Resolve を閉じてから。管理者の確認が出る）
    silent: true
    deps: [ofx:build]
    cmds:
      - cmd: >-
          powershell -NoProfile -Command '
          if (Get-Process Resolve -ErrorAction SilentlyContinue) { "Resolve が起動中。閉じてからもう一度"; exit 1 };
          $src = (Resolve-Path "{{.OFX_BUILD}}/bundles").Path;
          $p = Start-Process powershell -Verb RunAs -Wait -PassThru -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$((Resolve-Path scripts/ofx-install.ps1).Path)`" -Src `"$src`" -Dest `"{{.OFX_DIR}}`"";
          if ($p.ExitCode -ne 0) { "install failed"; exit 1 };
          Get-ChildItem "{{.OFX_DIR}}" -Directory -Filter "drs_*.ofx.bundle" | ForEach-Object { "installed: $($_.FullName)" };
          "Resolve を起動すると Effects > OpenFX > drs に出る"'
        platforms: [windows]
      - cmd: |
          sh -c '
          sudo mkdir -p "{{.OFX_DIR}}" && sudo rm -rf "{{.OFX_DIR}}"/drs_*.ofx.bundle && sudo cp -R {{.OFX_BUILD}}/bundles/drs_*.ofx.bundle "{{.OFX_DIR}}"/ || exit 1
          for f in "{{.OFX_DIR}}"/drs_*.ofx.bundle; do echo "installed: $f"; done'
        platforms: [darwin, linux]

  ofx:uninstall:
    desc: drs の OFX プラグインを消す（Resolve を閉じてから）
    silent: true
    cmds:
      - cmd: >-
          powershell -NoProfile -Command '
          $p = Start-Process powershell -Verb RunAs -Wait -PassThru -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$((Resolve-Path scripts/ofx-install.ps1).Path)`" -Dest `"{{.OFX_DIR}}`" -Uninstall";
          if ($p.ExitCode -eq 0) { "removed drs_*.ofx.bundle" } else { "uninstall failed"; exit 1 }'
        platforms: [windows]
      - cmd: sudo rm -rf "{{.OFX_DIR}}"/drs_*.ofx.bundle && echo "removed drs_*.ofx.bundle"
        platforms: [darwin, linux]

  open:
    desc: インストール先のフォルダを開く
    silent: true
    cmds:
      - cmd: powershell -NoProfile -Command 'ii "{{.LUT_ROOT}}"'
        platforms: [windows]
      - cmd: open "{{.LUT_ROOT}}"
        platforms: [darwin]
      - cmd: xdg-open "{{.LUT_ROOT}}"
        platforms: [linux]
