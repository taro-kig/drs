<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d6e"/>
      <stop offset="0.5" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffd23d"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2de2ff"/>
      <stop offset="1" stop-color="#7a5cff"/>
    </linearGradient>
    <pattern id="check" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#fff"/>
      <rect width="16" height="16" fill="#1a1a2e"/>
      <rect x="16" y="16" width="16" height="16" fill="#1a1a2e"/>
    </pattern>
  </defs>

  <!-- rounded badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)" stroke="#1a1a2e" stroke-width="14"/>

  <!-- speed lines -->
  <g stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0.85">
    <line x1="56" y1="150" x2="120" y2="150"/>
    <line x1="40" y1="190" x2="96" y2="190"/>
    <line x1="60" y1="230" x2="104" y2="230"/>
  </g>

  <!-- rear wing endplates -->
  <rect x="100" y="96" width="34" height="210" rx="10" fill="#1a1a2e"/>
  <rect x="378" y="96" width="34" height="210" rx="10" fill="#1a1a2e"/>
  <!-- main plane -->
  <rect x="120" y="236" width="272" height="40" rx="14" fill="#fff" stroke="#1a1a2e" stroke-width="10"/>
  <!-- flap: OPEN (tilted up) -->
  <g transform="rotate(-24 256 210)">
    <rect x="146" y="168" width="220" height="34" rx="14" fill="url(#flap)" stroke="#1a1a2e" stroke-width="10"/>
  </g>
  <!-- airflow through the gap -->
  <g fill="none" stroke="#1a1a2e" stroke-width="8" stroke-linecap="round">
    <path d="M150 222 q40 -6 70 4"/>
    <path d="M300 222 q30 -10 60 -18"/>
  </g>

  <!-- color wheels hanging under the wing -->
  <g stroke="#1a1a2e" stroke-width="9">
    <circle cx="176" cy="342" r="42" fill="#ff3d3d"/>
    <circle cx="256" cy="342" r="42" fill="#3dff8a" opacity="0.95"/>
    <circle cx="336" cy="342" r="42" fill="#3d7bff" opacity="0.95"/>
  </g>
  <g fill="#fff">
    <circle cx="176" cy="342" r="9"/>
    <circle cx="256" cy="342" r="9"/>
    <circle cx="336" cy="342" r="9"/>
  </g>

  <!-- DRS badge -->
  <g transform="rotate(-6 256 432)">
    <rect x="132" y="398" width="248" height="72" rx="36" fill="#1a1a2e"/>
    <rect x="144" y="410" width="48" height="48" rx="24" fill="url(#check)" stroke="#fff" stroke-width="4"/>
    <text x="290" y="449" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="46" fill="#3dff8a" letter-spacing="4">DRS</text>
  </g>

  <!-- sparkle -->
  <path d="M430 400 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z" fill="#fff" stroke="#1a1a2e" stroke-width="5"/>
</svg>
